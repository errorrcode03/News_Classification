categories:
  display_order:
  - Business
  - Entertainment
  - Politics
  - Sports
  - Technology
  label_map:
    business: Business
    entertainment: Entertainment
    politics: Politics
    sport: Sports
    tech: Technology
dataset:
  local_path: data/bbc-text.csv
  random_seed: 42
  test_ratio: 0.1
  train_ratio: 0.8
  url: https://huggingface.co/datasets/SetFit/bbc-news/raw/main/bbc-text.csv
  val_ratio: 0.1
embeddings:
  embed_dim: 100
  fine_tune: true
  glove_url: https://nlp.stanford.edu/data/glove.6B.zip
model:
  bidirectional: true
  dropout: 0.5
  embed_dim: 100
  fc_dropout: 0.3
  hidden_size: 128
  num_classes: 42
  num_layers: 2
paths:
  confusion_matrix_path: models/confusion_matrix.png
  data_dir: data
  dataset_local: data/news_category_dataset.csv
  glove_dir: data/glove
  glove_file: data/glove/glove.6B.100d.txt
  label_encoder_path: models/label_encoder.pkl
  log_file: training.log
  model_save_path: saved_model.pth
  word2idx_path: models/word2idx.pkl
preprocessing:
  max_seq_len: 512
  max_vocab_size: 25000
  min_word_freq: 2
training:
  batch_size: 64
  early_stopping_patience: 5
  epochs: 20
  grad_clip_max_norm: 1.0
  learning_rate: 0.001
  scheduler: cosine
  scheduler_T_max: 20
  scheduler_gamma: 0.5
  scheduler_step_size: 5
  weight_decay: 0.0001
